; DeltaFiltre firmware — PlatformIO
; env:esp32  = target build (bare ESP32-WROOM-32 module)
; env:native = host build that runs the core-logic unit tests (test/)
; FIRST IMPLEMENTATION — the ESP32 build has not been bench-tested.

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<core_main_native.cpp>

[env:native]
platform = native
build_flags = -std=c++17 -I src
test_framework = unity
